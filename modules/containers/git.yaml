apiVersion: v1
kind: Pod
metadata:
  name: Git
spec:
  containers:
    - name: gitlab
      image: gitlab/gitlab-ce:latest
      ports:
        - containerPort: 80
          hostPort: 8081
        - containerPort: 443
          hostPort: 443
        - containerPort: 22
          hostPort: 2222
      volumeMounts:
        - mountPath: /etc/gitlab
          name: gitlab-config
        - mountPath: /var/log/gitlab
          name: gitlab-logs
        - mountPath: /var/lib/gitlab
          name: gitlab-data
  volumes:
    - name: gitlab-config
      hostPath:
        path: /data/Git/gitlab/config
        type: DirectoryOrCreate
    - name: gitlab-logs
      hostPath:
        path: /data/Git/gitlab/logs
        type: DirectoryOrCreate
    - name: gitlab-data
      hostPath:
        path: /data/Git/gitlab/data
        type: DirectoryOrCreate
